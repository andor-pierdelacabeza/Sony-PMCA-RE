[project]
name = "sony-pmca-re"
version = "0.1.0a"
description = "Reverse Engineering Sony Digital Cameras"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asn1crypto>=1.5.1",
    "axmlparserpy==0.0.4",
    "certifi>=2025.7.14",
    "comtypes>=1.4.11 ; sys_platform == 'win32'",
    "pyasyncore>=1.0.4",
    "pycparser==2.17",
    "pycryptodomex>=3.23.0",
    "pyinstaller>=6.14.2",
    "pyusb>=1.3.1",
    "pywin32>=310 ; sys_platform == 'win32'",
    "pyyaml>=6.0.2",
    "tlslite-ng>=0.8.2",
]

[tool.black]
line-length = 120
target-version = ['py313']
